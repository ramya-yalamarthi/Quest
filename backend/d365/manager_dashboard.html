<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Insights — Manager Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f3f2f1; color: #1f2937; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#0078d4,#3b82f6);
              color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .head h1 { margin: 0; font-size: 18px; color: #0f3d6e; }
    .head .sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .refresh-btn { margin-left: auto; background: #0078d4; color: #fff; border: none; border-radius: 999px;
                   padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .refresh-btn:hover { background: #005a9e; }

    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: #fff; border: 1px solid #edebe9; border-radius: 8px; padding: 16px 18px;
                 box-shadow: 0 1px 4px rgba(0,0,0,.06); text-align: center; }
    .stat-num { font-size: 32px; font-weight: 700; color: #111827; }
    .stat-lbl { font-size: 12px; color: #6b7280; margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .stat-card.high .stat-num { color: #b91c1c; }
    .stat-card.medium .stat-num { color: #92400e; }

    .section-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #6b7280; text-transform: uppercase; margin-bottom: 10px; }
    .ticket-list { background: #fff; border: 1px solid #edebe9; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden; }
    .ticket-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #edebe9; transition: background .15s; }
    .ticket-row:last-child { border-bottom: none; }
    .ticket-row:hover { background: #f8fafc; }

    .risk-badge { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
    .risk-badge.high { background: #ef4444; }
    .risk-badge.medium { background: #f59e0b; }
    .risk-badge.low { background: #10b981; }

    .ticket-main { flex: 1; min-width: 0; }
    .ticket-title { font-size: 13.5px; font-weight: 600; color: #0078d4; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .ticket-title:hover { text-decoration: underline; }
    .ticket-num { font-size: 11.5px; color: #6b7280; margin-top: 2px; }
    .ticket-signals { font-size: 11.5px; color: #6b7280; margin-top: 4px; }

    .risk-pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .risk-pill.high { background: #fee2e2; color: #b91c1c; }
    .risk-pill.medium { background: #fef3c7; color: #92400e; }
    .risk-pill.low { background: #dcfce7; color: #15803d; }

    .spinner { text-align: center; padding: 40px; color: #6b7280; font-size: 14px; }
    .dot-spin { display: inline-block; width: 16px; height: 16px; border: 3px solid #c8c6c4; border-top-color: #0078d4;
                border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #a4262c; padding: 20px; text-align: center; }
    .empty { color: #6b7280; padding: 30px; text-align: center; font-size: 14px; }
    .last-updated { font-size: 11px; color: #9ca3af; margin-top: 12px; text-align: right; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="avatar">AI</div>
      <div><h1>Manager Dashboard</h1><div class="sub">Open ticket queue — ranked by risk</div></div>
      <button class="refresh-btn" id="refresh-btn">&#8635; Refresh</button>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="stat-total">—</div><div class="stat-lbl">Open tickets</div></div>
      <div class="stat-card high"><div class="stat-num" id="stat-high">—</div><div class="stat-lbl">High risk</div></div>
      <div class="stat-card medium"><div class="stat-num" id="stat-medium">—</div><div class="stat-lbl">Medium risk</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-low">—</div><div class="stat-lbl">Low / new</div></div>
    </div>

    <div class="section-label">ALL OPEN TICKETS</div>
    <div class="ticket-list" id="ticket-list">
      <div class="spinner"><span class="dot-spin"></span> Loading queue…</div>
    </div>
    <div class="last-updated" id="last-updated"></div>
  </div>

  <script>
    var BASE = "https://quest-z7e4.onrender.com";
    var API  = BASE + "/orchestrator/manager-dashboard";

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function openExternal(url) {
      var xrm = (window.parent && window.parent.Xrm) ? window.parent.Xrm : (window.Xrm || null);
      if (xrm && xrm.Navigation && xrm.Navigation.openUrl) { xrm.Navigation.openUrl(url); return; }
      try { (window.top || window).open(url, "_blank", "noopener"); } catch (_) { window.open(url, "_blank"); }
    }

    function priorityLabel(p) {
      return p === 1 ? "High" : (p === 3 ? "Low" : "Normal");
    }

    function render(data) {
      var tickets = data.tickets || [];
      var low = tickets.filter(function(t) { return t.risk.level === "low"; }).length;

      document.getElementById("stat-total").textContent = data.total_open;
      document.getElementById("stat-high").textContent  = data.high_risk;
      document.getElementById("stat-medium").textContent = data.medium_risk;
      document.getElementById("stat-low").textContent   = low;

      var list = document.getElementById("ticket-list");
      if (!tickets.length) {
        list.innerHTML = '<div class="empty">No open tickets right now.</div>';
        return;
      }

      var rows = tickets.map(function(t) {
        var risk = t.risk || {};
        var signals = (risk.signals || []).join(" · ") || "No risk signals";
        var age = risk.age_hours > 0 ? (risk.age_hours < 1 ? "< 1h old" : risk.age_hours + "h old") : "Just created";
        return '<div class="ticket-row">' +
          '<div class="risk-badge ' + escapeHtml(risk.level) + '"></div>' +
          '<div class="ticket-main">' +
            '<a class="ticket-title" href="' + escapeHtml(t.url || "#") + '" data-ext="1">' + escapeHtml(t.title || "Untitled") + '</a>' +
            '<div class="ticket-num">' + escapeHtml(t.ticket_number || "") + ' &middot; ' + escapeHtml(priorityLabel(t.priority)) + ' priority &middot; ' + escapeHtml(age) + '</div>' +
            '<div class="ticket-signals">' + escapeHtml(signals) + '</div>' +
          '</div>' +
          '<span class="risk-pill ' + escapeHtml(risk.level) + '">' + escapeHtml(risk.level.toUpperCase()) + '</span>' +
          '</div>';
      }).join("");

      list.innerHTML = rows;

      list.querySelectorAll("[data-ext]").forEach(function(a) {
        a.addEventListener("click", function(e) {
          e.preventDefault();
          openExternal(a.href);
        });
      });

      document.getElementById("last-updated").textContent =
        "Last updated: " + new Date().toLocaleTimeString();
    }

    function load() {
      document.getElementById("ticket-list").innerHTML =
        '<div class="spinner"><span class="dot-spin"></span> Loading queue…</div>';
      fetch(API)
        .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(render)
        .catch(function(e) {
          document.getElementById("ticket-list").innerHTML =
            '<div class="err">Could not load dashboard: ' + escapeHtml(String(e)) + '</div>';
        });
    }

    document.getElementById("refresh-btn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
