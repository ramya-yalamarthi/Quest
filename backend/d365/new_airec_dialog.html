<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Insights</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f3f2f1; color: #1f2937; }
    .wrap { padding: 16px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,#0078d4,#3b82f6); color: #fff;
              display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
    .head h2 { margin: 0; font-size: 16px; color: #0f3d6e; }
    .head .sub { font-size: 12px; color: #6b7280; margin-top: 1px; }
    .card { background: #fff; border: 1px solid #edebe9; border-radius: 8px; padding: 18px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,.08); line-height: 1.55; font-size: 14px; word-wrap: break-word; }
    .card a { color: #0078d4; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .spinner { display: flex; align-items: center; gap: 10px; color: #605e5c; padding: 24px; }
    .dot-spin { width: 16px; height: 16px; border: 3px solid #c8c6c4; border-top-color: #0078d4;
           border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #a4262c; padding: 16px; }

    .section-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #6b7280; text-transform: uppercase; }
    .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .divider { border-top: 1px solid #edebe9; margin: 16px 0; }
    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .pill-green { background: #dcfce7; color: #15803d; }
    .pill-blue { background: #dbeafe; color: #1d4ed8; }
    .pill-amber { background: #fef3c7; color: #92400e; }
    .pill-red { background: #fee2e2; color: #b91c1c; }
    .pill-gray { background: #f1f5f9; color: #475569; }

    .trend-row { display: flex; gap: 10px; margin-bottom: 4px; }
    .trend-card { flex: 1; background: #f8fafc; border: 1px solid #eef1f5; border-radius: 8px; padding: 12px 14px; }
    .trend-card .lbl { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .trend-card .num { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .trend-card .view { font-size: 12px; color: #0078d4; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
    .trend-detail { margin-top: 8px; font-size: 12.5px; background: #f8fafc; border-radius: 8px; padding: 10px 12px; }
    .trend-detail a { display: block; padding: 3px 0; }

    .bullet-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
    .bullet-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .bullet-dot.blue { background: #2563eb; }
    .bullet-dot.orange { background: #f59e0b; }
    .bullet-lbl { font-weight: 600; font-size: 13.5px; color: #111827; }
    .bullet-text { font-size: 13.5px; color: #374151; display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .pattern-box { background: #eff6ff; border-left: 3px solid #2563eb; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #1e3a8a; margin-top: 4px; }

    .kb-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
    .kb-card:last-child { margin-bottom: 0; }
    .kb-title { font-weight: 600; font-size: 13.5px; }
    .kb-meta { font-size: 12px; color: #6b7280; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .kb-wf-btn { cursor: pointer; border: none; font-family: inherit; }
    .kb-wf-box { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 12.5px; }
    .kb-wf-box ol { margin: 6px 0 0; padding-left: 18px; }

    .assign-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; }
    .assign-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .assign-avatar { width: 36px; height: 36px; border-radius: 50%; background: #0f3d6e; color: #fff; display: flex;
                      align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .assign-name { font-weight: 700; font-size: 14px; color: #111827; }
    .assign-meta { font-size: 12px; color: #6b7280; }
    .assign-desc { font-size: 13px; color: #374151; margin-bottom: 10px; }
    .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { background: #f1f5f9; color: #475569; font-size: 11px; padding: 3px 9px; border-radius: 999px; }

    .sla-line { font-size: 12.5px; color: #374151; margin-top: 10px; }
    .workflow-box { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; margin-top: 10px; font-size: 13px; }
    .workflow-box ol { margin: 6px 0 0; padding-left: 18px; }

    .fb-yesno button { padding: 6px 16px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><div class="avatar">AI</div><div><h2>AI Insights</h2><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="sub" id="case-sub"></div><div id="sla-header"></div></div></div>
      <a id="mgr-link" href="#" data-extlink="1" style="margin-left:auto;font-size:11px;color:#0078d4;white-space:nowrap;text-decoration:none">Manager view &#8599;</a>
    </div>
    <div id="content" class="card">
      <div class="spinner"><div class="dot-spin"></div> Loading recommendation…</div>
    </div>
  </div>

  <script>
    var BASE = "https://quest-z7e4.onrender.com";
    var DATA_URL = BASE + "/orchestrator/recommendation-data";
    var BACKEND = BASE + "/orchestrator/recommendation";   // plain-HTML fallback
    var REFINE  = BASE + "/orchestrator/refine";

    function getCaseId() {
      var p = new URLSearchParams(window.location.search);
      var d = p.get("data") || p.get("id") || "";
      return d.replace(/[{}]/g, "").trim();
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function openExternal(url) {
      var xrm = (window.parent && window.parent.Xrm) ? window.parent.Xrm : (window.Xrm || null);
      if (xrm && xrm.Navigation && xrm.Navigation.openUrl) { xrm.Navigation.openUrl(url); return; }
      try { (window.top || window).open(url, "_blank", "noopener"); } catch (_) { window.open(url, "_blank"); }
    }

    function showErr(msg) {
      document.getElementById("content").innerHTML = '<div class="err">' + escapeHtml(msg) + '</div>';
    }

    // ---------- card builders ----------
    function pct(x) {
      if (x === null || x === undefined || isNaN(x)) return null;
      return Math.round(parseFloat(x) * 100);
    }

    function confidencePill(conf) {
      var p = pct(conf);
      if (p === null) return "";
      var cls = p >= 70 ? "pill-green" : (p >= 45 ? "pill-amber" : "pill-gray");
      return '<span class="pill ' + cls + '">' + p + '% CONFIDENCE</span>';
    }

    function trendCard(label, bucket, key) {
      bucket = bucket || { count: 0, tickets: [] };
      return '<div class="trend-card">' +
        '<div class="lbl">' + escapeHtml(label) + '</div>' +
        '<div class="num">' + (bucket.count || 0) + '</div>' +
        '<button class="view" data-trend="' + key + '">View incidents &rarr;</button>' +
        '</div>';
    }

    function trendDetailHtml(bucket) {
      if (!bucket || !bucket.tickets || !bucket.tickets.length) {
        return '<div class="trend-detail">No incidents in this window.</div>';
      }
      var rows = bucket.tickets.map(function (t) {
        var label = escapeHtml((t.ticket_number || "") + " — " + (t.title || ""));
        return '<a href="' + escapeHtml(t.url || "#") + '" data-extlink="1">' + label + '</a>';
      }).join("");
      return '<div class="trend-detail">' + rows + '</div>';
    }

    function fmtAvgResolution(hrs) {
      if (hrs === null || hrs === undefined || isNaN(hrs)) return null;
      var h = parseFloat(hrs);
      return h < 1 ? ("~" + Math.round(h * 60) + " min avg") : ("~" + h.toFixed(1) + "h avg");
    }

    function kbCardHtml(doc, idx) {
      var titleHtml = doc.url
        ? '<a href="' + escapeHtml(doc.url) + '" data-extlink="1">' + escapeHtml(doc.title) + '</a>'
        : escapeHtml(doc.title);
      var meta = [];
      if (doc.success_rate !== null && doc.success_rate !== undefined) {
        meta.push(Math.round(doc.success_rate * 100) + "% resolved");
      }
      var avg = fmtAvgResolution(doc.avg_resolution_hours);
      if (avg) meta.push(avg);
      var pills = [];
      pills.push((doc.workflow_available && (doc.workflow_steps || []).length)
        ? '<button class="pill pill-green kb-wf-btn" data-kbwf="' + idx + '">Workflow available &rarr;</button>'
        : '<span class="pill pill-gray">Manual only</span>');
      var topPickPill = doc.top_pick ? '<span class="pill pill-blue">Top pick</span>' : '';
      return '<div class="kb-card">' +
        '<div class="row-between" style="margin-bottom:0"><div class="kb-title">' + titleHtml + '</div>' + topPickPill + '</div>' +
        '<div class="kb-meta">' + escapeHtml(meta.join(" · ")) + pills.join("") + '</div>' +
        '<div class="kb-wf-steps" id="kb-wf-' + idx + '"></div>' +
        '</div>';
    }

    function assignCardHtml(eng) {
      var initials = (eng.name || "?").split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase();
      var shiftLbl = eng.on_shift ? "On shift" : (eng.on_call ? "On-call" : "Off shift");
      var cap = (eng.capacity != null && eng.load != null) ? (eng.load + "/" + eng.capacity + " capacity") : "";
      var tags = [eng.team].concat(eng.skills || []).filter(Boolean)
        .map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join("");
      return '<div class="assign-card">' +
        '<div class="assign-head"><div class="assign-avatar">' + escapeHtml(initials) + '</div><div>' +
        '<div class="assign-name">' + escapeHtml(eng.name) + '</div>' +
        '<div class="assign-meta">' + escapeHtml(eng.team || "") + ' &middot; ' + shiftLbl + (cap ? ' &middot; ' + cap : '') + '</div>' +
        '</div></div>' +
        '<div class="assign-desc">' + escapeHtml(eng.reason || "") + '</div>' +
        '<div class="tag-row">' + tags + '</div>' +
        '</div>';
    }

    function renderData(data) {
      var es = data.executive_summary || {};
      var trends = data.incident_trends || {};
      var assign = data.recommended_assignment || {};
      var eng = assign.engineer || {};
      var sla = data.sla;
      var workflow = data.suggested_workflow;

      document.getElementById("case-sub").textContent =
        (data.case && data.case.ticket_number || "") + (data.case && data.case.title ? " · " + data.case.title : "");
      var slaHeaderEl = document.getElementById("sla-header");
      if (slaHeaderEl && sla) {
        var hMins = sla.minutes_to_resolution_deadline;
        var hClock = hMins >= 0 ? (hMins + " min left") : ("OVERDUE by " + (-hMins) + " min");
        var hColor, hBg, hBorder;
        if (sla.resolution_breached || sla.breach_risk === "critical") {
          hColor = "#b91c1c"; hBg = "#fee2e2"; hBorder = "#fca5a5";
        } else if (sla.breach_risk === "at_risk") {
          hColor = "#92400e"; hBg = "#fef3c7"; hBorder = "#fde68a";
        } else {
          hColor = "#15803d"; hBg = "#dcfce7"; hBorder = "#86efac";
        }
        slaHeaderEl.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;background:' + hBg + ';border:1px solid ' + hBorder + ';color:' + hColor + ';padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700">' +
          escapeHtml(sla.tier) + ' &middot; ' + escapeHtml(hClock) + '</span>';
      }

      var html = "";

      // L2 auto-escalation banner — shown when system has already escalated to L2
      if (data.l2_escalation && data.l2_escalation.escalated) {
        var l2 = data.l2_escalation;
        html += '<div style="background:#faf5ff;border:2px solid #7c3aed;border-radius:10px;padding:14px 16px;margin-bottom:14px">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
            '<span style="background:#7c3aed;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px">AUTO-ESCALATED TO L2</span>' +
            '<span style="font-size:11.5px;color:#6b21a8">' + escapeHtml(l2.escalated_at || "") + ' UTC</span>' +
          '</div>' +
          '<div style="font-size:13px;color:#1f2937;margin-bottom:6px">' +
            'This ticket was automatically escalated because the SLA was breached and could not be resolved at L1.' +
          '</div>' +
          '<div style="font-size:13px;font-weight:600;color:#5b21b6;margin-bottom:10px">' +
            '&#128100; Assigned L2 Engineer: ' + escapeHtml(l2.l2_engineer_name || "—") +
            (l2.l2_engineer_email ? ' <span style="font-weight:400;color:#6b7280">(' + escapeHtml(l2.l2_engineer_email) + ')</span>' : '') +
          '</div>' +
          '</div>';
      }

      var showL1L2 = (escalation && (escalation.level === "high" || escalation.level === "medium")) || (sla && sla.resolution_breached);
      if (showL1L2 && !(data.l2_escalation && data.l2_escalation.escalated)) {
        html += '<div style="background:#faf5ff;border:2px solid #7c3aed;border-radius:10px;padding:14px 16px;margin-bottom:14px">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
            '<span style="background:#7c3aed;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px">L1 → L2 ESCALATION</span>' +
          '</div>' +
          '<div style="font-size:13px;color:#1f2937;margin-bottom:10px">SLA breached or high escalation risk — assign this ticket to an L2 engineer.</div>' +
          '<button id="l1l2-btn" style="background:#7c3aed;color:#fff;border:none;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600">Assign to L2 Engineer &#8594;</button>' +
          '<div id="l1l2-result" style="display:none;margin-top:10px"></div>' +
          '</div>';
      }

      html += '<div class="section-label" style="margin-bottom:10px">INCIDENT TRENDS</div>';
      html += '<div class="trend-row">' +
        trendCard("This week", trends.week, "week") +
        trendCard("This month", trends.month, "month") +
        trendCard("This quarter", trends.quarter, "quarter") +
        '</div>';
      html += '<div id="trend-detail"></div>';
      html += '<div class="divider"></div>';

      var escalation = data.escalation_risk;
      var escalationBadge = "";
      if (escalation) {
        var eLvl = escalation.level;
        var eCls = eLvl === "high" ? "pill-red" : (eLvl === "medium" ? "pill-amber" : "pill-gray");
        var eIcon = eLvl === "high" ? "&#9888; " : (eLvl === "medium" ? "&#9888; " : "");
        escalationBadge = '<span class="pill ' + eCls + '" title="' + escapeHtml((escalation.signals || []).join(" · ")) + '">' +
          eIcon + "ESCALATION RISK: " + eLvl.toUpperCase() + '</span>';
      }
      html += '<div class="row-between"><span class="section-label">EXECUTIVE SUMMARY</span><div style="display:flex;gap:6px;align-items:center">' + escalationBadge + '</div></div>';
      if (es.current_issue) {
        html += '<div class="bullet-row"><div class="bullet-dot blue"></div><div>' +
          '<div class="bullet-lbl">Current issue</div><div class="bullet-text">' + escapeHtml(es.current_issue) + '</div></div></div>';
      }
      if (es.probable_cause) {
        html += '<div class="bullet-row"><div class="bullet-dot orange"></div><div>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><div class="bullet-lbl">Probable cause</div>' + confidencePill(es.confidence) + '</div>' +
          '<div class="bullet-text">' + escapeHtml(es.probable_cause) + '</div></div></div>';
      }
      if (es.pattern_detected) {
        html += '<div class="pattern-box"><b>Pattern detected:</b> ' + escapeHtml(es.pattern_detected) + '</div>';
      }
      if (escalation && (escalation.signals || []).length) {
        var eLvlColor = escalation.level === "high" ? "#b91c1c" : (escalation.level === "medium" ? "#92400e" : "#475569");
        var eLvlBg = escalation.level === "high" ? "#fff1f2" : (escalation.level === "medium" ? "#fffbeb" : "#f8fafc");
        var eLvlBorder = escalation.level === "high" ? "#fca5a5" : (escalation.level === "medium" ? "#fde68a" : "#e5e7eb");
        html += '<div style="background:' + eLvlBg + ';border-left:3px solid ' + eLvlBorder + ';border-radius:6px;padding:10px 12px;font-size:13px;color:' + eLvlColor + ';margin-top:8px">' +
          '<b>Escalation signals:</b> ' + escapeHtml((escalation.signals || []).join(" · ")) + '</div>';
      }
      if (data.missing_info && (data.missing_info.missing_fields || []).length) {
        html += '<div style="background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:12px 14px;margin-top:8px">' +
          '<div style="font-size:12.5px;font-weight:600;color:#c2410c;margin-bottom:6px">&#9888; Missing information detected</div>' +
          '<ul style="margin:0 0 8px;padding-left:18px;font-size:12.5px;color:#374151">' +
          data.missing_info.missing_fields.map(function(f) {
            return '<li>' + escapeHtml(f.charAt(0).toUpperCase() + f.slice(1)) + '</li>';
          }).join("") +
          '</ul>' +
          '<button id="missing-email-btn" style="background:none;border:1px solid #c2410c;border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;color:#c2410c">Generate customer email &#8595;</button>' +
          '<div id="missing-email-detail" style="display:none;margin-top:8px">' +
            '<pre id="missing-email-text" style="font-family:\'Segoe UI\',Arial,sans-serif;font-size:12px;background:#fff;border:1px solid #fdba74;border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin:0;color:#374151"></pre>' +
            '<button id="missing-email-copy" style="margin-top:6px;background:none;border:1px solid #c2410c;border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:#c2410c">Copy to clipboard</button>' +
          '</div>' +
          '</div>';
      }
      html += '<div class="divider"></div>';

      var cluster = data.cluster;
      if (cluster && cluster.count) {
        var clusterTicketsHtml = (cluster.tickets || []).map(function(t) {
          var matchPct = Math.round((t.match_score || 0) * 100);
          return '<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e9d5ff;font-size:12.5px">' +
            '<a href="' + escapeHtml(t.url || "#") + '" data-extlink="1" style="color:#7c3aed;font-weight:500">' + escapeHtml(t.ticket_number || "") + ' — ' + escapeHtml(t.title || "") + '</a>' +
            '<span style="color:#6b21a8;font-size:11px;white-space:nowrap;margin-left:8px">' + matchPct + '% match</span>' +
            '</div>';
        }).join("");
        html += '<div class="section-label" style="margin-bottom:8px">RELATED OPEN TICKETS <span style="font-weight:400;text-transform:none;font-size:11px;color:#374151">— may share the same root cause</span></div>';
        html += '<div style="background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:12px 14px;margin-bottom:4px">';
        html += '<button id="cluster-toggle" style="width:100%;text-align:left;background:none;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;color:#6b21a8;font-weight:600;padding:0;display:flex;align-items:center;gap:6px">' +
          '<span id="cluster-arrow" style="font-size:10px">&#9654;</span>' +
          '<span>' + cluster.count + ' other open ticket' + (cluster.count > 1 ? 's' : '') + ' appear to share this root cause — click to view</span>' +
          '</button>';
        html += '<div id="cluster-tickets" style="display:none;margin-top:8px">' + clusterTicketsHtml + '</div>';
        html += '</div><div class="divider"></div>';
      }

      var kbDocs = data.kb_recommendations || [];
      if (kbDocs.length) {
        html += '<div class="section-label" style="margin-bottom:10px">KNOWLEDGE BASE RECOMMENDATIONS</div>';
        html += kbDocs.map(function (d, i) { return kbCardHtml(d, i); }).join("");
        if (data.kb_gap_detected) {
          html += '<div style="background:#fefce8;border:1px solid #fde68a;border-radius:6px;padding:10px 12px;font-size:12.5px;color:#92400e;margin-top:10px">' +
            '&#9888; No exact KB article found for this issue type. Documents above are the closest available alternatives.' +
            '<div style="margin-top:8px">' +
              '<button id="kb-draft-btn" style="background:none;border:1px solid #92400e;border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;color:#92400e">Draft KB Article &#8595;</button>' +
            '</div>' +
            '<div id="kb-draft-detail" style="display:none;margin-top:8px">' +
              '<pre id="kb-draft-text" style="font-family:\'Segoe UI\',Arial,sans-serif;font-size:12px;background:#fff;border:1px solid #fde68a;border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin:0;color:#374151"></pre>' +
              '<button id="kb-draft-copy" style="margin-top:6px;background:none;border:1px solid #92400e;border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:#92400e">Copy to clipboard</button>' +
            '</div>' +
            '</div>';
        }
        html += '<div class="divider"></div>';
      }

      if (data.auto_resolve && data.auto_resolve.available) {
        var ar = data.auto_resolve;
        html += '<div class="section-label" style="margin-bottom:10px">AUTO-RESOLUTION AVAILABLE</div>';
        html += '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 14px;margin-bottom:4px">' +
          '<div style="font-size:13px;color:#15803d;font-weight:600;margin-bottom:4px">&#10003; ' + Math.round(ar.match_score * 100) + '% match — near-identical past case resolved</div>' +
          '<div style="font-size:12.5px;color:#6b7280;margin-bottom:8px">' + escapeHtml(ar.matched_ticket || "") + (ar.matched_title ? ' &middot; ' + escapeHtml(ar.matched_title) : '') + '</div>' +
          '<button class="pill pill-green" id="auto-resolve-btn" style="cursor:pointer;border:none;font-family:inherit;padding:5px 14px;font-size:12.5px">View matched case &rarr;</button>' +
          '<div id="auto-resolve-detail" style="margin-top:10px;display:none">' +
            '<div style="font-size:12.5px;color:#374151;background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px;white-space:pre-wrap">' +
              escapeHtml((ar.resolution_text || "").slice(0, 500)) + (ar.resolution_text && ar.resolution_text.length > 500 ? "…" : "") +
            '</div>' +
          '</div>' +
          '</div>';
        html += '<div class="divider"></div>';
      }

      if (eng.name) {
        html += '<div class="row-between"><span class="section-label">RECOMMENDED ASSIGNMENT</span>' + confidencePill(eng.confidence) + '</div>';
        html += assignCardHtml(eng);
      }

      if (sla) {
        var mins = sla.minutes_to_resolution_deadline;
        var clock = mins >= 0 ? (mins + " min left") : ("OVERDUE by " + (-mins) + " min");
        var riskHtml = "";
        if (sla.breach_risk === "critical") {
          riskHtml = ' &middot; <span class="pill pill-red" style="font-size:11px">&#9888; SLA BREACH LIKELY</span>';
        } else if (sla.breach_risk === "at_risk") {
          riskHtml = ' &middot; <span class="pill pill-amber" style="font-size:11px">&#9888; At risk of breach</span>';
        }
        html += '<div class="sla-line">SLA: <b>' + escapeHtml(sla.tier) + '</b> &middot; Resolution ' + clock +
                (sla.resolution_breached ? ' &middot; <span style="color:#b91c1c">&#9888; SLA BREACHED</span>' : '') +
                riskHtml + '</div>';
      }
      if (data.customer_comm_gap) {
        var gap = data.customer_comm_gap;
        html += '<div style="background:#fff1f2;border-left:3px solid #ef4444;border-radius:6px;padding:8px 12px;font-size:12.5px;color:#b91c1c;margin-top:8px">' +
          '&#9888; <b>Customer not updated in ' + gap.hours_since_update + 'h</b>' +
          (gap.no_notes ? ' — no updates have been sent since ticket creation.' : ' — send a status update now.') +
          '</div>';
      }
      if (data.resolution_prediction) {
        var rp = data.resolution_prediction;
        var rpRange = "~" + rp.range_low + "–" + rp.range_high + " " + rp.unit +
                      " (" + (rp.workflow_guided ? "workflow-guided" : "manual") + ")";
        var rpCls = rp.confidence === "high" ? "color:#15803d" : (rp.confidence === "medium" ? "color:#92400e" : "color:#475569");
        html += '<div style="font-size:12px;color:#6b7280;margin-top:5px">Estimated resolution: ' +
          '<b style="' + rpCls + '">' + escapeHtml(rpRange) + '</b>' +
          ' &middot; <span style="font-style:italic">' + escapeHtml(rp.note) + '</span></div>';
      }
      html += '<div style="margin-top:10px">' +
        '<button id="handoff-btn" style="background:none;border:1px solid #c8c6c4;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;color:#374151">Generate Handoff Note &#8595;</button>' +
        '</div>' +
        '<div id="handoff-detail" style="display:none;margin-top:8px">' +
          '<pre id="handoff-text" style="font-family:\'Segoe UI\',Arial,sans-serif;font-size:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin:0"></pre>' +
          '<button id="handoff-copy" style="margin-top:6px;background:none;border:1px solid #0078d4;border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:#0078d4">Copy to clipboard</button>' +
        '</div>';
      if (workflow) {
        var steps = (workflow.steps || []).map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join("");
        html += '<div class="workflow-box"><b>Suggested workflow:</b> ' + escapeHtml(workflow.title) + '<ol>' + steps + '</ol></div>';
      }

      html += '<div class="divider"></div><div id="feedback-anchor"></div>';

      var el = document.getElementById("content");
      el.innerHTML = html;
      renderFeedbackPrompt();
      wireDynamicHandlers(data);
    }

    function buildHandoffNote(data) {
      var es = data.executive_summary || {};
      var assign = data.recommended_assignment || {};
      var eng = assign.engineer || {};
      var sla = data.sla || {};
      var kbDocs = data.kb_recommendations || [];
      var workflow = data.suggested_workflow;
      var caseNum = (data.case && data.case.ticket_number) || "";
      var sep = "=".repeat(48);
      var lines = ["HANDOFF NOTE — " + caseNum, sep, ""];
      lines.push("TICKET: " + ((data.case && data.case.title) || ""));
      lines.push("");
      lines.push("CURRENT SITUATION:");
      lines.push((es.current_issue || "Under investigation").slice(0, 350));
      lines.push("");
      lines.push("PROBABLE CAUSE:");
      lines.push(es.probable_cause || "Under investigation");
      lines.push("");
      if (eng.name) lines.push("ASSIGNED TO: " + eng.name + " (" + (eng.team || "") + ")");
      if (sla.tier) {
        var mins = sla.minutes_to_resolution_deadline;
        lines.push("SLA: " + sla.tier + " — " +
          (mins >= 0 ? mins + " min remaining" : "OVERDUE by " + (-mins) + " min"));
      }
      if (data.resolution_prediction) {
        var rp = data.resolution_prediction;
        lines.push("EST. RESOLUTION: ~" + rp.range_low + "–" + rp.range_high + " " + rp.unit);
      }
      lines.push("");
      if (kbDocs.length) {
        lines.push("KB ARTICLES CONSULTED:");
        kbDocs.forEach(function(d) { lines.push("  • " + d.title); });
        lines.push("");
      }
      if (workflow && (workflow.steps || []).length) {
        lines.push("SUGGESTED NEXT STEPS:");
        (workflow.steps || []).forEach(function(s, i) { lines.push("  " + (i + 1) + ". " + s); });
      }
      return lines.join("\n");
    }

    function buildEscalationHandover(data) {
      var es = data.executive_summary || {};
      var assign = data.recommended_assignment || {};
      var eng = assign.engineer || {};
      var sla = data.sla || {};
      var kbDocs = data.kb_recommendations || [];
      var workflow = data.suggested_workflow;
      var escalation = data.escalation_risk || {};
      var l1 = data.line1_context || {};
      var caseNum = (data.case && data.case.ticket_number) || "";
      var sep = "=".repeat(48);
      var lines = ["L1 → L2 ESCALATION HANDOVER — " + caseNum, sep, ""];
      lines.push("TICKET: " + ((data.case && data.case.title) || ""));
      lines.push("");
      lines.push("── WHAT LINE 1 UNDERSTOOD ──");
      lines.push((es.current_issue || "Under investigation").slice(0, 350));
      lines.push("");
      lines.push("PROBABLE CAUSE (Line 1 assessment):");
      lines.push(es.probable_cause || "Not determined at Line 1 level");
      lines.push("");
      if (l1.tried && l1.tried.length) {
        lines.push("── WHAT LINE 1 ALREADY TRIED ──");
        l1.tried.forEach(function(note, i) { lines.push((i + 1) + ". " + note); });
        lines.push("");
      } else {
        lines.push("── WHAT LINE 1 ALREADY TRIED ──");
        lines.push("No engineer notes recorded — ticket may be newly created.");
        lines.push("");
      }
      if (kbDocs.length) {
        lines.push("KB ARTICLES CONSULTED AT LINE 1:");
        kbDocs.forEach(function(d) { lines.push("  • " + d.title + " (" + Math.round(d.success_rate * 100) + "% resolved)"); });
        lines.push("");
      }
      if (workflow) {
        lines.push("WORKFLOW AVAILABLE (not yet completed):");
        lines.push("  " + workflow.title);
        lines.push("");
      }
      lines.push("── WHY ESCALATION IS NEEDED ──");
      if ((escalation.signals || []).length) {
        escalation.signals.forEach(function(s) { lines.push("  • " + s); });
      } else {
        lines.push("  • Ticket unresolved beyond expected window");
      }
      lines.push("");
      if (sla.tier) {
        var mins = sla.minutes_to_resolution_deadline;
        lines.push("SLA STATUS: " + sla.tier + " — " +
          (mins >= 0 ? mins + " min remaining" : "OVERDUE by " + (-mins) + " min"));
        lines.push("");
      }
      lines.push("── SUGGESTED NEXT STEPS FOR LINE 2 ──");
      if (workflow && (workflow.steps || []).length) {
        (workflow.steps || []).forEach(function(s, i) { lines.push("  " + (i + 1) + ". " + s); });
      } else {
        lines.push("  1. Review Line 1 notes above and continue investigation");
        lines.push("  2. Engage specialist or escalate further if root cause confirmed");
      }
      if (eng.name) {
        lines.push("");
        lines.push("RECOMMENDED ENGINEER FOR LINE 2: " + eng.name + " (" + (eng.team || "") + ")");
      }
      return lines.join("\n");
    }

    function buildKbDraft(data) {
      var es = data.executive_summary || {};
      var workflow = data.suggested_workflow;
      var title = (data.case && data.case.title) || "New Issue";
      var lines = ["# " + title + " — Resolution Guide", ""];
      lines.push("**Category:** [Classify this issue type]");
      lines.push("**Success rate:** [Track after N resolutions]");
      lines.push("");
      lines.push("## Problem Description");
      lines.push((es.current_issue || "[Describe the symptom the customer sees]").slice(0, 400));
      lines.push("");
      lines.push("## Root Cause");
      lines.push(es.probable_cause || "[Document confirmed root cause after resolution]");
      lines.push("");
      lines.push("## Resolution Steps");
      if (workflow && (workflow.steps || []).length) {
        (workflow.steps || []).forEach(function(s, i) { lines.push((i + 1) + ". " + s); });
      } else {
        lines.push("1. [Step 1: initial diagnostic check]");
        lines.push("2. [Step 2: apply fix]");
        lines.push("3. [Step 3: verify resolution]");
      }
      lines.push("");
      lines.push("## Notes");
      lines.push("[Any caveats, version-specific behaviour, or related issues to watch for]");
      return lines.join("\n");
    }

    function wireDynamicHandlers(data) {
      var el = document.getElementById("content");
      var openTrendKey = null;

      var trendButtons = el.querySelectorAll("[data-trend]");
      for (var i = 0; i < trendButtons.length; i++) {
        trendButtons[i].addEventListener("click", function (e) {
          var btn = e.currentTarget;
          var key = btn.getAttribute("data-trend");
          var detailEl = document.getElementById("trend-detail");

          if (openTrendKey === key) {                  // clicked the open one again -> close it
            detailEl.innerHTML = "";
            btn.textContent = "View incidents →";
            openTrendKey = null;
            return;
          }
          if (openTrendKey) {                           // switching -> reset the previously open button's label
            var prevBtn = el.querySelector('[data-trend="' + openTrendKey + '"]');
            if (prevBtn) prevBtn.textContent = "View incidents →";
          }
          var bucket = (data.incident_trends || {})[key];
          detailEl.innerHTML = trendDetailHtml(bucket);
          btn.textContent = "Hide incidents →";
          openTrendKey = key;
        });
      }

      var kbWfButtons = el.querySelectorAll("[data-kbwf]");
      for (var k = 0; k < kbWfButtons.length; k++) {
        kbWfButtons[k].addEventListener("click", function (e) {
          var btn = e.currentTarget;
          var idx = btn.getAttribute("data-kbwf");
          var stepsEl = document.getElementById("kb-wf-" + idx);
          if (!stepsEl) return;
          if (stepsEl.innerHTML) {                 // already open -> close it
            stepsEl.innerHTML = "";
            btn.textContent = "Workflow available →";
            return;
          }
          var doc = (data.kb_recommendations || [])[parseInt(idx, 10)] || {};
          var steps = doc.workflow_steps || [];
          var stepsHtml = steps.map(function (s) { return "<li>" + escapeHtml(s) + "</li>"; }).join("");
          stepsEl.innerHTML = '<div class="kb-wf-box"><b>' + escapeHtml(doc.workflow_title || "Suggested workflow") +
            "</b><ol>" + stepsHtml + "</ol></div>";
          btn.textContent = "Hide steps →";
        });
      }

      var l1l2Btn = el.querySelector("#l1l2-btn");
      if (l1l2Btn) {
        l1l2Btn.addEventListener("click", function() {
          var caseId = getCaseId();
          var resultEl = document.getElementById("l1l2-result");
          if (!resultEl) return;
          l1l2Btn.disabled = true;
          l1l2Btn.textContent = "Assigning…";
          fetch(BASE + "/orchestrator/escalate-to-l2?case=" + encodeURIComponent(caseId), { method: "POST" })
            .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
            .then(function(res) {
              l1l2Btn.style.display = "none";
              var preview = (res.note_preview || "").replace(/<br>/g, "\n").replace(/<[^>]+>/g, "");
              resultEl.innerHTML =
                '<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px 14px;margin-bottom:8px">' +
                  '<div style="font-size:13px;font-weight:700;color:#15803d;margin-bottom:4px">&#10003; ' +
                    (res.already_escalated ? 'Already escalated' : 'Assigned to L2 Engineer') +
                  '</div>' +
                  '<div style="font-size:13px;color:#1f2937">&#128100; <b>' + escapeHtml(res.l2_engineer_name || "—") + '</b>' +
                    (res.l2_engineer_email ? ' <span style="color:#6b7280">(' + escapeHtml(res.l2_engineer_email) + ')</span>' : '') +
                  '</div>' +
                  '<div style="font-size:12px;color:#6b7280;margin-top:2px">' + escapeHtml((res.l2_seniority || "") + (res.l2_team ? " · " + res.l2_team : "")) + '</div>' +
                '</div>' +
                '<pre id="l1l2-text" style="font-family:\'Segoe UI\',Arial,sans-serif;font-size:11.5px;background:#fff;border:1px solid #e9d5ff;border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin:0;color:#374151;max-height:260px;overflow-y:auto">' + escapeHtml(preview) + '</pre>' +
                '<button id="l1l2-copy" style="margin-top:6px;background:none;border:1px solid #7c3aed;border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:#7c3aed">Copy to clipboard</button>';
              resultEl.style.display = "block";
              var copyBtn = document.getElementById("l1l2-copy");
              if (copyBtn) {
                copyBtn.addEventListener("click", function() {
                  var txt = document.getElementById("l1l2-text");
                  if (txt && navigator.clipboard) navigator.clipboard.writeText(txt.textContent).catch(function() {});
                  copyBtn.textContent = "Copied!";
                  setTimeout(function() { copyBtn.textContent = "Copy to clipboard"; }, 1500);
                });
              }
            })
            .catch(function(err) {
              l1l2Btn.disabled = false;
              l1l2Btn.textContent = "Assign to L2 Engineer →";
              resultEl.innerHTML = '<div style="color:#b91c1c;font-size:12.5px;margin-top:6px">&#9888; Could not assign: ' + escapeHtml(String(err)) + '</div>';
              resultEl.style.display = "block";
            });
        });
      }

      var clusterToggle = el.querySelector("#cluster-toggle");
      if (clusterToggle) {
        clusterToggle.addEventListener("click", function() {
          var tickets = document.getElementById("cluster-tickets");
          var arrow = document.getElementById("cluster-arrow");
          if (!tickets) return;
          var open = tickets.style.display !== "none";
          tickets.style.display = open ? "none" : "block";
          if (arrow) arrow.innerHTML = open ? "&#9654;" : "&#9660;";
        });
      }

      var missingEmailBtn = el.querySelector("#missing-email-btn");
      if (missingEmailBtn) {
        missingEmailBtn.addEventListener("click", function() {
          var detail = document.getElementById("missing-email-detail");
          if (!detail) return;
          if (detail.style.display !== "none") {
            detail.style.display = "none";
            missingEmailBtn.textContent = "Generate customer email ↓";
            return;
          }
          document.getElementById("missing-email-text").textContent = (data.missing_info || {}).suggested_email || "";
          detail.style.display = "block";
          missingEmailBtn.textContent = "Hide email ↑";
        });
      }
      var missingEmailCopy = el.querySelector("#missing-email-copy");
      if (missingEmailCopy) {
        missingEmailCopy.addEventListener("click", function() {
          var txt = document.getElementById("missing-email-text");
          if (txt && navigator.clipboard) navigator.clipboard.writeText(txt.textContent).catch(function() {});
          missingEmailCopy.textContent = "Copied!";
          setTimeout(function() { missingEmailCopy.textContent = "Copy to clipboard"; }, 1500);
        });
      }

      var mgrLink = document.getElementById("mgr-link");
      if (mgrLink) {
        var mgrUrl = BASE + "/orchestrator/manager-dashboard-ui";
        mgrLink.href = mgrUrl;
        mgrLink.addEventListener("click", function(e) {
          e.preventDefault();
          openExternal(mgrUrl);
        });
      }

      var handoffBtn = el.querySelector("#handoff-btn");
      if (handoffBtn) {
        handoffBtn.addEventListener("click", function () {
          var detail = document.getElementById("handoff-detail");
          if (!detail) return;
          if (detail.style.display !== "none") {
            detail.style.display = "none";
            handoffBtn.textContent = "Generate Handoff Note ↓";
            return;
          }
          document.getElementById("handoff-text").textContent = buildHandoffNote(data);
          detail.style.display = "block";
          handoffBtn.textContent = "Hide Handoff Note ↑";
        });
      }
      var handoffCopy = el.querySelector("#handoff-copy");
      if (handoffCopy) {
        handoffCopy.addEventListener("click", function () {
          var txt = document.getElementById("handoff-text");
          if (txt && navigator.clipboard) navigator.clipboard.writeText(txt.textContent).catch(function () {});
          handoffCopy.textContent = "Copied!";
          setTimeout(function () { handoffCopy.textContent = "Copy to clipboard"; }, 1500);
        });
      }

      var kbDraftBtn = el.querySelector("#kb-draft-btn");
      if (kbDraftBtn) {
        kbDraftBtn.addEventListener("click", function () {
          var detail = document.getElementById("kb-draft-detail");
          if (!detail) return;
          if (detail.style.display !== "none") {
            detail.style.display = "none";
            kbDraftBtn.textContent = "Draft KB Article ↓";
            return;
          }
          document.getElementById("kb-draft-text").textContent = buildKbDraft(data);
          detail.style.display = "block";
          kbDraftBtn.textContent = "Hide Draft ↑";
        });
      }
      var kbDraftCopy = el.querySelector("#kb-draft-copy");
      if (kbDraftCopy) {
        kbDraftCopy.addEventListener("click", function () {
          var txt = document.getElementById("kb-draft-text");
          if (txt && navigator.clipboard) navigator.clipboard.writeText(txt.textContent).catch(function () {});
          kbDraftCopy.textContent = "Copied!";
          setTimeout(function () { kbDraftCopy.textContent = "Copy to clipboard"; }, 1500);
        });
      }

      var arBtn = el.querySelector("#auto-resolve-btn");
      if (arBtn) {
        arBtn.addEventListener("click", function () {
          var detail = document.getElementById("auto-resolve-detail");
          var ar = data.auto_resolve || {};
          if (!detail) return;
          if (detail.style.display === "none") {
            detail.style.display = "block";
            arBtn.textContent = "Hide details →";
            if (ar.url) {
              var linkEl = detail.querySelector(".ar-open-link");
              if (!linkEl) {
                var linkDiv = document.createElement("div");
                linkDiv.style.cssText = "margin-top:8px;font-size:12.5px";
                linkDiv.innerHTML = '<a href="' + escapeHtml(ar.url) + '" data-extlink="1" style="color:#0078d4">Open matched ticket in D365 →</a>';
                detail.appendChild(linkDiv);
                linkDiv.querySelector("a").classList.add("ar-open-link");
              }
            }
          } else {
            detail.style.display = "none";
            arBtn.textContent = "View matched case →";
          }
        });
      }

      el.addEventListener("click", function (e) {
        var a = e.target;
        while (a && a.tagName !== "A") a = a.parentNode;
        if (a && a.getAttribute && a.getAttribute("data-extlink")) {
          e.preventDefault();
          openExternal(a.href);
        }
      });
    }

    // ---------- feedback (same survey mechanism as before, restyled) ----------
    var LIKE_REASONS = ["Correct root cause identified", "Right engineer assigned", "The fix actually worked", "Saved me time", "Other"];
    var DISLIKE_REASONS = ["Wrong team / category", "Wrong engineer assigned", "Root cause was incorrect", "The fix didn't help", "Other"];
    var fbDone = false;
    var lastData = null;

    function feedbackUrl(isLike) {
      return BACKEND.replace("/recommendation", "/feedback") +
             "?case=" + encodeURIComponent(getCaseId()) + "&v=" + (isLike ? "like" : "dislike");
    }

    function renderFeedbackPrompt() {
      var anchor = document.getElementById("feedback-anchor");
      if (!anchor || fbDone) return;
      anchor.innerHTML =
        '<div style="font-size:14px;font-weight:600;margin-bottom:10px">Was this recommendation helpful?</div>' +
        '<div class="fb-yesno">' +
        '<button id="fb-yes" style="margin-right:8px;border:1px solid #0078d4;background:#e8f1fb;color:#0078d4">&#128077; Yes</button>' +
        '<button id="fb-no" style="border:1px solid #c8c6c4;background:#fff;color:#201f1e">&#128078; No</button>' +
        '</div>';
      document.getElementById("fb-yes").addEventListener("click", function () { showFeedbackSurvey(true); });
      document.getElementById("fb-no").addEventListener("click", function () { showFeedbackSurvey(false); });
    }

    function showFeedbackSurvey(isLike) {
      var reasons = isLike ? LIKE_REASONS : DISLIKE_REASONS;
      var anchor = document.getElementById("feedback-anchor");
      var checks = reasons.map(function (r, i) {
        return '<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;cursor:pointer">' +
               '<input type="checkbox" class="fb-reason" value="' + escapeHtml(r) + '" id="fb-r' + i + '"> ' + escapeHtml(r) + '</label>';
      }).join("");
      anchor.innerHTML =
        '<div style="font-size:15px;font-weight:600;color:#0f3d6e;margin-bottom:14px">Was this recommendation helpful?</div>' +
        '<div class="fb-yesno" style="margin-bottom:16px">' +
        '<button id="fb-yes2" style="margin-right:8px;border:1px solid ' + (isLike ? '#0078d4;background:#e8f1fb;color:#0078d4' : '#c8c6c4;background:#fff;color:#201f1e') + '">&#128077; Yes</button>' +
        '<button id="fb-no2" style="border:1px solid ' + (!isLike ? '#0078d4;background:#e8f1fb;color:#0078d4' : '#c8c6c4;background:#fff;color:#201f1e') + '">&#128078; No</button>' +
        '</div>' +
        '<div style="font-size:13px;font-weight:600;margin-bottom:8px">What is the reason for your feedback?</div>' +
        '<div style="margin-bottom:14px">' + checks + '</div>' +
        '<div style="font-size:12.5px;color:#6b7280;margin-bottom:6px">Tell us more (optional):</div>' +
        '<textarea id="fb-comment" style="width:100%;box-sizing:border-box;min-height:60px;border:1px solid #c8c6c4;border-radius:6px;padding:8px;font-family:inherit;font-size:13px;margin-bottom:12px"></textarea>' +
        '<button id="fb-submit" style="background:#0078d4;color:#fff;border:none;border-radius:999px;padding:7px 20px;cursor:pointer;font-size:13px;font-weight:600">Submit</button>';

      document.getElementById("fb-yes2").addEventListener("click", function () { showFeedbackSurvey(true); });
      document.getElementById("fb-no2").addEventListener("click", function () { showFeedbackSurvey(false); });
      document.getElementById("fb-submit").addEventListener("click", function () {
        var picked = Array.prototype.slice.call(document.querySelectorAll(".fb-reason:checked")).map(function (c) { return c.value; });
        var freeText = (document.getElementById("fb-comment").value || "").trim();
        var comment = picked.concat(freeText ? [freeText] : []).join(" | ");
        submitFeedback(feedbackUrl(isLike), comment, isLike);
      });
    }

    function submitFeedback(url, comment, isLike) {
      fbDone = true;
      try { fetch(url + "&comment=" + encodeURIComponent(comment)).catch(function () {}); } catch (e) {}
      var anchor = document.getElementById("feedback-anchor");

      if (isLike) {
        anchor.innerHTML = '<div style="text-align:center;padding:16px 0">' +
          '<div style="font-size:36px;margin-bottom:6px">&#128077;</div>' +
          '<div style="color:#107c10;font-size:14px;font-weight:600">Thanks for your feedback!</div></div>';
        return;
      }

      anchor.innerHTML = '<div class="spinner"><div class="dot-spin"></div> Updating the recommendation based on your feedback…</div>';
      var refineUrl = REFINE + "?case=" + encodeURIComponent(getCaseId()) + "&comment=" + encodeURIComponent(comment);
      fetch(refineUrl)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function () {
          fbDone = false;
          loadRecommendation(getCaseId());   // re-fetch the structured data fresh
        })
        .catch(function () {
          anchor.innerHTML = '<div class="err">Could not update the recommendation. Your feedback was recorded.</div>';
        });
    }

    // ---------- plain-HTML fallback (Dataverse note, if the JSON endpoint is unavailable) ----------
    function renderPlainHtml(html) {
      var el = document.getElementById("content");
      if (html && /^\s*&lt;/.test(html)) {
        var t = document.createElement("textarea");
        t.innerHTML = html;
        html = t.value;
      }
      el.innerHTML = html || '<div class="err">No recommendation found for this case.</div>';
    }

    function readNoteFromDataverse(caseId) {
      try {
        var xrm = (window.parent && window.parent.Xrm) ? window.parent.Xrm : (window.Xrm || null);
        if (!xrm || !xrm.WebApi) { showErr("Could not load the recommendation."); return; }
        xrm.WebApi.retrieveMultipleRecords(
          "annotation",
          "?$select=notetext&$top=1&$orderby=createdon desc" +
          "&$filter=_objectid_value eq " + caseId + " and subject eq 'AI Support Recommendation'"
        ).then(function (res) {
          if (res.entities && res.entities.length) renderPlainHtml(res.entities[0].notetext);
          else showErr("No recommendation found yet for this case.");
        }, function () { showErr("Could not load the recommendation."); });
      } catch (e) { showErr("Could not load the recommendation."); }
    }

    function loadPlainFallback(caseId) {
      fetch(BACKEND + "?case=" + encodeURIComponent(caseId))
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(renderPlainHtml)
        .catch(function () { readNoteFromDataverse(caseId); });
    }

    // ---------- main load ----------
    function loadRecommendation(caseId) {
      document.getElementById("content").innerHTML = '<div class="spinner"><div class="dot-spin"></div> Analyzing the case…</div>';
      fetch(DATA_URL + "?case=" + encodeURIComponent(caseId))
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) { lastData = data; renderData(data); })
        .catch(function () { loadPlainFallback(caseId); });
    }

    (function () {
      var caseId = getCaseId();
      if (!caseId) { showErr("No case id was passed to the dialog."); return; }
      loadRecommendation(caseId);
    })();
  </script>
</body>
</html>
