<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Insights</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f3f2f1; color: #201f1e; }
    .wrap { padding: 16px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #0f3d6e; color: #fff;
              display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
    .head h2 { margin: 0; font-size: 16px; color: #0f3d6e; }
    .card { background: #fff; border: 1px solid #edebe9; border-radius: 8px; padding: 18px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,.08); line-height: 1.55; font-size: 14px; word-wrap: break-word; }
    .card b { color: #0f3d6e; }
    .card a { color: #0078d4; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .spinner { display: flex; align-items: center; gap: 10px; color: #605e5c; padding: 24px; }
    .dot { width: 16px; height: 16px; border: 3px solid #c8c6c4; border-top-color: #0078d4;
           border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #a4262c; padding: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><div class="avatar">AI</div><h2>AI Insights</h2></div>
    <div id="content" class="card">
      <div class="spinner"><div class="dot"></div> Loading recommendation…</div>
    </div>
  </div>

  <script>
    // Deployed backend endpoint that returns the recommendation as HTML.
    var BACKEND = "https://quest-z7e4.onrender.com/orchestrator/recommendation";
    var REFINE  = "https://quest-z7e4.onrender.com/orchestrator/refine";

    function getCaseId() {
      var p = new URLSearchParams(window.location.search);
      var d = p.get("data") || p.get("id") || "";
      return d.replace(/[{}]/g, "").trim();
    }

    // The backend returns REAL HTML, so we render it directly. If a future
    // response is entity-encoded (starts with &lt;), decode it once first.
    function render(html) {
      var el = document.getElementById("content");
      if (html && /^\s*&lt;/.test(html)) {
        var t = document.createElement("textarea");
        t.innerHTML = html;
        html = t.value;
      }
      el.innerHTML = html || '<div class="err">No recommendation found for this case.</div>';
    }

    var fbDone = false;   // feedback already submitted for this open

    // Intercept link clicks: feedback 👍/👎 are handled INLINE (no navigation);
    // every other link opens in a new tab (target="_blank" is blocked in the
    // sandboxed web-resource iframe, so use D365's navigation API).
    function wireLinks(el) {
      el.addEventListener("click", function (e) {
        var a = e.target;
        while (a && a.tagName !== "A") a = a.parentNode;
        if (!a || !a.href) return;
        e.preventDefault();
        if (a.href.indexOf("/orchestrator/feedback") !== -1) {
          onFeedbackClick(a);
          return;
        }
        var url = a.href;
        var xrm = (window.parent && window.parent.Xrm) ? window.parent.Xrm : (window.Xrm || null);
        if (xrm && xrm.Navigation && xrm.Navigation.openUrl) {
          xrm.Navigation.openUrl(url);
        } else {
          try { (window.top || window).open(url, "_blank", "noopener"); }
          catch (_) { window.open(url, "_blank"); }
        }
      });
    }

    var LIKE_REASONS = [
      "Correct root cause identified",
      "Right engineer assigned",
      "The fix actually worked",
      "Saved me time",
      "Other",
    ];
    var DISLIKE_REASONS = [
      "Wrong team / category",
      "Wrong engineer assigned",
      "Root cause was incorrect",
      "The fix didn't help",
      "Other",
    ];

    function escapeHtml(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function feedbackUrl(isLike) {
      return BACKEND.replace("/recommendation", "/feedback") +
             "?case=" + encodeURIComponent(getCaseId()) + "&v=" + (isLike ? "like" : "dislike");
    }

    // Replaces the AI analysis card with the survey -- same popup, same spot,
    // matching the "Was this page helpful?" pattern (Yes/No + reasons + comment).
    function showFeedbackSurvey(isLike) {
      var reasons = isLike ? LIKE_REASONS : DISLIKE_REASONS;
      var el = document.getElementById("content");
      var checks = reasons.map(function (r, i) {
        return '<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;cursor:pointer">' +
               '<input type="checkbox" class="fb-reason" value="' + escapeHtml(r) + '" id="fb-r' + i + '"> ' +
               escapeHtml(r) + '</label>';
      }).join("");
      el.innerHTML =
        '<div style="font-size:16px;font-weight:600;color:#0f3d6e;margin-bottom:14px">Was this recommendation helpful?</div>' +
        '<div style="margin-bottom:16px">' +
          '<button id="fb-yes" style="margin-right:8px;padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;' +
          'border:1px solid ' + (isLike ? '#0078d4;background:#e8f1fb;color:#0078d4' : '#c8c6c4;background:#fff;color:#201f1e') + '">👍 Yes</button>' +
          '<button id="fb-no" style="padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;' +
          'border:1px solid ' + (!isLike ? '#0078d4;background:#e8f1fb;color:#0078d4' : '#c8c6c4;background:#fff;color:#201f1e') + '">👎 No</button>' +
        '</div>' +
        '<div style="font-size:14px;font-weight:600;margin-bottom:8px">What is the reason for your feedback?</div>' +
        '<div style="margin-bottom:14px">' + checks + '</div>' +
        '<div style="font-size:13px;color:#605e5c;margin-bottom:6px">Tell us more (optional):</div>' +
        '<textarea id="fb-comment" style="width:100%;box-sizing:border-box;min-height:64px;' +
        'border:1px solid #c8c6c4;border-radius:6px;padding:8px;font-family:inherit;font-size:13px;margin-bottom:12px"></textarea>' +
        '<button id="fb-submit" style="background:#0078d4;color:#fff;border:none;border-radius:4px;' +
        'padding:7px 20px;cursor:pointer;font-size:13px">Submit</button>';

      document.getElementById("fb-yes").addEventListener("click", function () { showFeedbackSurvey(true); });
      document.getElementById("fb-no").addEventListener("click", function () { showFeedbackSurvey(false); });
      document.getElementById("fb-submit").addEventListener("click", function () {
        var picked = Array.prototype.slice.call(document.querySelectorAll(".fb-reason:checked"))
                          .map(function (c) { return c.value; });
        var freeText = (document.getElementById("fb-comment").value || "").trim();
        var comment = picked.concat(freeText ? [freeText] : []).join(" | ");
        submitFeedback(feedbackUrl(isLike), comment, isLike);
      });
    }

    function onFeedbackClick(a) {
      if (fbDone) return;
      var isLike = /[?&]v=like(\b|&|$)/.test(a.href);
      showFeedbackSurvey(isLike);
    }

    function submitFeedback(url, comment, isLike) {
      fbDone = true;
      // Record the 👍/👎 (and comment) on the case, fire-and-forget.
      try { fetch(url + "&comment=" + encodeURIComponent(comment)).catch(function () {}); } catch (e) {}

      // 👍 -> just confirm, in the same popup. 👎 -> regenerate a better answer.
      if (isLike) {
        document.getElementById("content").innerHTML =
          '<div style="text-align:center;padding:24px 0">' +
          '<div style="font-size:40px;margin-bottom:8px">👍</div>' +
          '<div style="color:#107c10;font-size:15px;font-weight:600">Thanks for your feedback!</div>' +
          '</div>';
        return;
      }

      // Regenerate the recommendation using the engineer's comment, then show it
      // in place (no duplicate before/after -- the old answer is replaced).
      var el = document.getElementById("content");
      el.innerHTML = '<div class="spinner"><div class="dot"></div> ' +
                     'Updating the recommendation based on your feedback…</div>';
      var refineUrl = REFINE + "?case=" + encodeURIComponent(getCaseId()) +
                      "&comment=" + encodeURIComponent(comment);
      fetch(refineUrl)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (html) {
          fbDone = false;          // allow feedback again on the new answer
          render(html);
        })
        .catch(function () {
          showErr("Could not update the recommendation. Your feedback was recorded.");
        });
    }

    function showErr(msg) {
      document.getElementById("content").innerHTML = '<div class="err">' + msg + '</div>';
    }

    // CSP-safe fallback: read the latest AI note straight from Dataverse.
    function readNoteFromDataverse(caseId) {
      try {
        var xrm = (window.parent && window.parent.Xrm) ? window.parent.Xrm : (window.Xrm || null);
        if (!xrm || !xrm.WebApi) { showErr("Could not load the recommendation."); return; }
        xrm.WebApi.retrieveMultipleRecords(
          "annotation",
          "?$select=notetext&$top=1&$orderby=createdon desc" +
          "&$filter=_objectid_value eq " + caseId +
          " and subject eq 'AI Support Recommendation'"
        ).then(function (res) {
          if (res.entities && res.entities.length) render(res.entities[0].notetext);
          else showErr("No recommendation found yet for this case.");
        }, function () { showErr("Could not load the recommendation."); });
      } catch (e) { showErr("Could not load the recommendation."); }
    }

    // While the case is still being analysed, the backend note is just a
    // placeholder ("AI analysis in progress…"). Detect that and keep polling so
    // the finished answer appears on its own -- no manual Refresh needed.
    function isInProgress(html) { return /analysis in progress/i.test(html || ""); }

    function showAnalyzing() {
      document.getElementById("content").innerHTML =
        '<div class="spinner"><div class="dot"></div> Analyzing the case…</div>';
    }

    function loadRecommendation(caseId, attempt) {
      attempt = attempt || 0;
      fetch(BACKEND + "?case=" + encodeURIComponent(caseId))
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (html) {
          if (isInProgress(html) && attempt < 40) {     // not ready -> wait and retry (~2 min)
            showAnalyzing();
            setTimeout(function () { loadRecommendation(caseId, attempt + 1); }, 3000);
          } else {
            render(html);
          }
        })
        .catch(function () { readNoteFromDataverse(caseId); });
    }

    (function () {
      var caseId = getCaseId();
      if (!caseId) { showErr("No case id was passed to the dialog."); return; }
      wireLinks(document.getElementById("content"));   // delegated: attach ONCE, survives re-renders
      loadRecommendation(caseId);
    })();
  </script>
</body>
</html>
